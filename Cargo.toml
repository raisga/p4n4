[workspace]
resolver = "3"
members = ["xtask"]
# The P0 spikes are separate Cargo projects, deleted in P1 (spikes/README.md).
exclude = ["spikes"]

[workspace.package]
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/raisga/p4n4"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
